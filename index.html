<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻牌配對</title>
<style>
  :root {
    --bg: #1b1f3b; --panel: #262b52; --text: #f3f4ff; --muted: #9aa0d0;
    --card-back: #5b6cff; --card-front: #ffffff; --accent: #ffcb47;
    --p1: #ff6b6b; --p2: #4ecdc4; --p3: #ffd166; --p4: #b388ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  button, select, input { font: inherit; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* setup */
  #setup { max-width: 460px; margin: 0 auto; padding: 32px 20px; }
  #setup h1 { text-align: center; font-size: 34px; margin: 0 0 24px; }
  .field { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .field > label, .field > .lbl { display: block; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; }
  select, input[type=text] {
    background: #151834; color: var(--text); border: 1px solid #3a4080;
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .times { font-size: 20px; color: var(--muted); }
  #sizeHint { margin-top: 8px; font-size: 13px; color: var(--muted); }
  #sizeHint.bad { color: #ff8a8a; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #3a4080;
    background: #151834; color: var(--text); cursor: pointer;
  }
  .seg button.on { background: var(--card-back); border-color: var(--card-back); }
  #names { display: grid; gap: 8px; }
  #names .row span { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .primary {
    width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: 0;
    border-radius: 12px; background: var(--accent); color: #2b2300; cursor: pointer;
  }
  .primary:disabled { opacity: .4; cursor: not-allowed; }

  /* game */
  #game { padding: 10px; }
  #bar { display: flex; gap: 8px; align-items: stretch; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .pl {
    background: var(--panel); border-radius: 10px; padding: 6px 14px; min-width: 96px;
    text-align: center; border: 3px solid transparent; transition: .2s;
  }
  .pl .n { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .pl .s { font-size: 24px; font-weight: 700; }
  .pl.cur { border-color: var(--c); transform: scale(1.06); box-shadow: 0 0 14px var(--c); }
  .pl.cur .n { color: var(--text); }
  #tools { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  #tools button {
    background: transparent; color: var(--muted); border: 1px solid #3a4080;
    border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  #msg { text-align: center; height: 24px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  #board { display: grid; justify-content: center; gap: var(--gap); }
  .card { width: var(--size); height: var(--size); perspective: 600px; cursor: pointer; }
  .card .in {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .35s;
  }
  .card.up .in { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 18%; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .back { background: var(--card-back); box-shadow: inset 0 0 0 2px #ffffff30; }
  .back::after { content: "?"; color: #ffffff80; font-weight: 700; font-size: calc(var(--size) * .45); }
  .front { background: var(--card-front); transform: rotateY(180deg); font-size: calc(var(--size) * .62); line-height: 1; }
  .card.up .front { box-shadow: 0 0 0 3px var(--accent); }
  .card.taken { pointer-events: none; }
  .card.taken .in { transform: rotateY(180deg) scale(.0); opacity: 0; transition: transform .5s .3s, opacity .5s .3s; }
  .card.taken .front { box-shadow: 0 0 0 3px var(--c); }

  /* result */
  #overlay {
    position: fixed; inset: 0; background: #000a; display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 5;
  }
  #overlay.show { display: flex; }
  #result { background: var(--panel); border-radius: 18px; padding: 28px; max-width: 420px; width: 100%; text-align: center; }
  #result h2 { margin: 0 0 4px; font-size: 28px; }
  #rank { list-style: none; padding: 0; margin: 16px 0 20px; text-align: left; }
  #rank li { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: #151834; margin-bottom: 6px; border-left: 6px solid var(--c); }
  #rank li.win { background: #3a3410; }
  #result .btns { display: flex; gap: 10px; }
  #result .btns button { flex: 1; }
  .ghost { background: transparent; color: var(--text); border: 1px solid #3a4080; border-radius: 12px; padding: 12px; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

<section id="setup" class="screen active">
  <h1>🃏 翻牌配對</h1>

  <div class="field">
    <span class="lbl">棋盤大小（列 × 行，格數須為偶數）</span>
    <div class="row">
      <select id="rows"></select><span class="times">×</span><select id="cols"></select>
    </div>
    <div id="sizeHint"></div>
  </div>

  <div class="field">
    <span class="lbl">玩家人數</span>
    <div class="seg" id="pcount">
      <button data-n="2" class="on">2 人</button>
      <button data-n="3">3 人</button>
      <button data-n="4">4 人</button>
    </div>
  </div>

  <div class="field">
    <span class="lbl">玩家名稱</span>
    <div id="names"></div>
  </div>

  <button class="primary" id="start">開始遊戲</button>
</section>

<section id="game" class="screen">
  <div id="bar"></div>
  <div id="msg"></div>
  <div id="board"></div>
</section>

<div id="overlay">
  <div id="result">
    <h2 id="rTitle"></h2>
    <ul id="rank"></ul>
    <div class="btns">
      <button class="ghost" id="again">再玩一次</button>
      <button class="primary" id="back">重新設定</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = Array.from(new Set((
  "🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦆🦉🦇🐺🐗🐴🦄🐝🐛🦋🐌🐞🐜🦗🕷🦂🐢🐍🦎🐙🦑🦐🦀🐡🐠🐟🐬🐳🐋🦈🐊🐅🐆🦓🦍🐘🦛🦏🐪🐫🦒🦘🐃🐂🐄🐎🐖🐏🐑🦙🐐🦌🐕🐩🐈🐓🦃🦚🦜🦢🕊🐇🦝🦨🦡🦦🦥🐁🐀🐿🦔" +
  "🍎🍐🍊🍋🍌🍉🍇🍓🫐🍈🍒🍑🥭🍍🥥🥝🍅🍆🥑🥦🥕🌽🌶🥔🍠🥐🍞🥖🧀🥚🍳🥞🥓🍔🍟🍕🌭🌮🍣🍩🍪🎂🍰🍫🍬🍭☕🍺" +
  "⚽🏀🏈⚾🎾🏐🎱🏓🎸🎹🎺🎻🥁🎨🎲🎯🚗🚕🚌🚓🚑🚒🚜🚲🛵✈🚀🚁⛵🚂🌸🌹🌻🌲🌵🍄🌙⭐🌈🔥❄🌊"
).match(/\p{Extended_Pictographic}️?/gu)));
const COLORS = ["#ff6b6b", "#4ecdc4", "#ffd166", "#b388ff"];
const $ = id => document.getElementById(id);

let state = null;           // current game
let cfg = { rows: 8, cols: 8, players: 2, names: ["玩家 1", "玩家 2", "玩家 3", "玩家 4"] };

/* ---------- setup ---------- */
for (const id of ["rows", "cols"]) {
  for (let i = 8; i <= 12; i++) $(id).add(new Option(i, i));
}
function updateHint() {
  const r = +$("rows").value, c = +$("cols").value, total = r * c;
  const ok = total % 2 === 0;
  $("sizeHint").className = ok ? "" : "bad";
  $("sizeHint").textContent = ok
    ? `共 ${total} 張牌，${total / 2} 對圖片`
    : `${r} × ${c} = ${total} 為奇數，無法兩兩成對，請調整`;
  $("start").disabled = !ok;
}
$("rows").onchange = $("cols").onchange = updateHint;

function renderNames() {
  $("names").innerHTML = "";
  for (let i = 0; i < cfg.players; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span style="background:${COLORS[i]}"></span><input type="text" maxlength="8" value="${cfg.names[i]}">`;
    row.querySelector("input").oninput = e => cfg.names[i] = e.target.value;
    $("names").append(row);
  }
}
$("pcount").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  cfg.players = +b.dataset.n;
  [...$("pcount").children].forEach(x => x.classList.toggle("on", x === b));
  renderNames();
};
$("start").onclick = () => {
  cfg.rows = +$("rows").value; cfg.cols = +$("cols").value;
  startGame();
};
$("again").onclick = startGame;
$("back").onclick = showSetup;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
}
function showSetup() { $("overlay").classList.remove("show"); show("setup"); }

/* ---------- game ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  $("overlay").classList.remove("show");
  const total = cfg.rows * cfg.cols, pairs = total / 2;
  const symbols = shuffle([...EMOJIS]).slice(0, pairs);
  const deck = shuffle([...symbols, ...symbols]);
  state = {
    deck, cur: 0, picked: [], lock: false, left: pairs,
    scores: Array(cfg.players).fill(0),
    names: cfg.names.slice(0, cfg.players).map((n, i) => n.trim() || `玩家 ${i + 1}`),
  };
  buildBoard();
  renderBar();
  setMsg(`${state.names[0]} 先開始`);
  show("game");
  layout();
}

function buildBoard() {
  const b = $("board");
  b.innerHTML = "";
  b.style.gridTemplateColumns = `repeat(${cfg.cols}, var(--size))`;
  state.deck.forEach((sym, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="in"><div class="face back"></div><div class="face front">${sym}</div></div>`;
    el.onclick = () => flip(i);
    b.append(el);
  });
}

function renderBar() {
  const bar = $("bar");
  bar.innerHTML = "";
  state.names.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = "pl" + (i === state.cur ? " cur" : "");
    d.style.setProperty("--c", COLORS[i]);
    d.innerHTML = `<div class="n"></div><div class="s">${state.scores[i]}</div>`;
    d.querySelector(".n").textContent = n;
    bar.append(d);
  });
  const t = document.createElement("div");
  t.id = "tools";
  t.innerHTML = `<button id="restart">重來</button><button id="menu">設定</button>`;
  bar.append(t);
  $("restart").onclick = startGame;
  $("menu").onclick = showSetup;
}

function setMsg(t) { $("msg").textContent = t; }
const cardEl = i => $("board").children[i];

function flip(i) {
  const s = state, el = cardEl(i);
  if (s.lock || s.picked.includes(i) || el.classList.contains("taken")) return;
  el.classList.add("up");
  s.picked.push(i);
  if (s.picked.length < 2) return;

  s.lock = true;
  const [a, b] = s.picked;
  if (s.deck[a] === s.deck[b]) {
    setTimeout(() => {
      for (const k of [a, b]) {
        const c = cardEl(k);
        c.style.setProperty("--c", COLORS[s.cur]);
        c.classList.add("taken");
      }
      s.scores[s.cur]++;
      s.left--;
      s.picked = [];
      s.lock = false;
      renderBar();
      if (s.left === 0) return setTimeout(finish, 900);
      setMsg(`${s.names[s.cur]} 配對成功！繼續翻牌`);
    }, 700);
  } else {
    setTimeout(() => {
      cardEl(a).classList.remove("up");
      cardEl(b).classList.remove("up");
      s.picked = [];
      s.cur = (s.cur + 1) % s.names.length;
      s.lock = false;
      renderBar();
      setMsg(`輪到 ${s.names[s.cur]}`);
    }, 1000);
  }
}

function finish() {
  const s = state, max = Math.max(...s.scores);
  const winners = s.names.filter((_, i) => s.scores[i] === max);
  $("rTitle").textContent = winners.length > 1 ? `🤝 平手：${winners.join("、")}` : `🏆 ${winners[0]} 獲勝！`;
  const order = s.names.map((n, i) => i).sort((x, y) => s.scores[y] - s.scores[x]);
  $("rank").innerHTML = "";
  for (const i of order) {
    const li = document.createElement("li");
    li.style.setProperty("--c", COLORS[i]);
    if (s.scores[i] === max) li.className = "win";
    li.innerHTML = `<span></span><b>${s.scores[i]} 對</b>`;
    li.firstChild.textContent = s.names[i];
    $("rank").append(li);
  }
  $("overlay").classList.add("show");
}

/* ---------- responsive sizing ---------- */
function layout() {
  if (!state) return;
  const gap = 4, bar = $("bar").offsetHeight + $("msg").offsetHeight + 30;
  const w = window.innerWidth - 20, h = window.innerHeight - bar - 10;
  const size = Math.max(18, Math.floor(Math.min(
    (w - gap * (cfg.cols - 1)) / cfg.cols,
    (h - gap * (cfg.rows - 1)) / cfg.rows)));
  const b = $("board");
  b.style.setProperty("--size", size + "px");
  b.style.setProperty("--gap", gap + "px");
}
addEventListener("resize", layout);

renderNames();
updateHint();
</script>
</body>
</html>
